# Configuração do projeto Supabase.
# Necessária para o CLI (`supabase db push`) e para a integração GitHub →
# Supabase reconhecerem este repositório como um projeto e aplicarem as
# migrações de supabase/migrations/.

project_id = "calendario"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# O bucket `media` é criado pela migração 20260914000200, junto com as
# políticas de leitura pública e escrita restrita ao dono.
file_size_limit = "100MiB"

[auth]
enabled = true
# Em produção, troque para a URL da Vercel e adicione-a também em
# Authentication > URL Configuration no dashboard do Supabase.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Deixe true em produção. Em false, o cadastro já entra logado — útil para
# testar o fluxo antes de configurar o provedor de e-mail.
enable_confirmations = false

[inbucket]
enabled = true
port = 54324
